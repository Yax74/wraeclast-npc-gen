name: Publish v2.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v2.0.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v2.0.0

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run validation and simulation tests
        run: npm run check

      - name: Validate release metadata
        run: node tools/validate-release.mjs "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Build Foundry release assets
        run: |
          mkdir -p dist/package
          cp module.json README.md CHANGELOG.md dist/package/
          cp -R data scripts styles templates dist/package/
          cp module.json dist/module.json
          (cd dist/package && zip -q -r ../wraeclast-npc-gen.zip .)
          (cd dist && sha256sum wraeclast-npc-gen.zip > wraeclast-npc-gen.zip.sha256)

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG"             dist/module.json             dist/wraeclast-npc-gen.zip             dist/wraeclast-npc-gen.zip.sha256             --title "Wraeclast NPC Generator 2.0.0"             --generate-notes             --latest
