name: Dispatch v2.1.0 assets once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.1.0.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run the permanent release builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --field tag=v2.1.0 --repo "$GITHUB_REPOSITORY"
