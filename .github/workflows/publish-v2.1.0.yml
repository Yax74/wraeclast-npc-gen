name: Publish v2.1.0 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.1.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the module
        run: npm run check

      - name: Publish v2.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.1.0 >/dev/null 2>&1 || gh release create v2.1.0 \
            --target "$GITHUB_SHA" \
            --title "Wraeclast NPC Generator 2.1.0" \
            --notes "Adds a proper parent-faction and clan/subfaction hierarchy, all twelve Karui god-clans, and all five Stygian internal factions. Includes branch-aware filters, locks, professions, hooks, outputs, validation, and legacy macro compatibility."
