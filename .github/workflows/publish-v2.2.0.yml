name: Publish v2.2.0 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.2.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate module and release metadata
        run: |
          npm run check
          node tools/validate-release.mjs v2.2.0 "$GITHUB_REPOSITORY"

      - name: Create the v2.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.2.0 >/dev/null 2>&1 || gh release create v2.2.0 \
            --target "fa66a909d199daaf466efca0babcfbfa33bc3eff" \
            --title "Wraeclast NPC Generator 2.2.0" \
            --notes "Expands the generator to 830 names, 659 professions, and 598 descriptors. Adds cultural voice pools, broader cultural occupations, stronger compatibility validation, deterministic diversity tests, and faster indexed generation."

      - name: Build Foundry release assets
        run: |
          mkdir -p dist/package
          cp module.json README.md CHANGELOG.md dist/package/
          cp -R data scripts styles templates dist/package/
          cp module.json dist/module.json
          (cd dist/package && zip -q -r ../wraeclast-npc-gen.zip .)
          (cd dist && sha256sum wraeclast-npc-gen.zip > wraeclast-npc-gen.zip.sha256)

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.2.0 \
            dist/module.json \
            dist/wraeclast-npc-gen.zip \
            dist/wraeclast-npc-gen.zip.sha256 \
            --clobber
