name: Build release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, such as v2.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run validation and simulation tests
        run: npm run check

      - name: Validate the release tag and manifest URLs
        run: node tools/validate-release.mjs "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Build Foundry release assets
        run: |
          mkdir -p dist/package
          cp module.json README.md CHANGELOG.md dist/package/
          cp -R data scripts styles templates dist/package/
          cp module.json dist/module.json
          (cd dist/package && zip -q -r ../wraeclast-npc-gen.zip .)
          (cd dist && sha256sum wraeclast-npc-gen.zip > wraeclast-npc-gen.zip.sha256)

      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/module.json
          dist/wraeclast-npc-gen.zip
          dist/wraeclast-npc-gen.zip.sha256
          --clobber

