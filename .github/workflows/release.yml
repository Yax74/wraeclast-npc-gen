name: Bootstrap source and build release assets

on:
  push:
    branches: [main]
    paths: [wraeclast-npc-gen-source.tar.gz]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import the prepared source tree
        run: |
          tar -xzf wraeclast-npc-gen-source.tar.gz
          rm wraeclast-npc-gen-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Wraeclast NPC Generator 2.0.0"
          git push

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validation and simulation tests
        run: npm run check
      - name: Validate the release tag and manifest URLs
        run: node tools/validate-release.mjs "$RELEASE_TAG" "$GITHUB_REPOSITORY"
      - name: Build Foundry release assets
        run: |
          mkdir -p dist/package
          cp module.json README.md CHANGELOG.md dist/package/
          cp -R data scripts styles templates dist/package/
          cp module.json dist/module.json
          (cd dist/package && zip -q -r ../wraeclast-npc-gen.zip .)
          (cd dist && sha256sum wraeclast-npc-gen.zip > wraeclast-npc-gen.zip.sha256)
      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/module.json
          dist/wraeclast-npc-gen.zip
          dist/wraeclast-npc-gen.zip.sha256
          --clobber
